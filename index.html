<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TaskFlow – Task Manager</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--text:#1b2133;--muted:#6b7490;--line:#e4e8f2;--brand:#4f46e5;--brand-d:#4338ca;--hi:#e5484d;--med:#f5a524;--lo:#30a46c;--chip:#eef0fa;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1220;--card:#181c30;--text:#eceefa;--muted:#9aa2c0;--line:#2a3050;--chip:#232948;--brand:#7c78ff;--brand-d:#6a66f0;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1220;--card:#181c30;--text:#eceefa;--muted:#9aa2c0;--line:#2a3050;--chip:#232948;--brand:#7c78ff;--brand-d:#6a66f0;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.5}
.wrap{max-width:720px;margin:0 auto;padding:32px 16px 48px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
h1{margin:0;font-size:1.6rem;letter-spacing:-.02em}
h1 span{color:var(--brand)}
.sub{color:var(--muted);font-size:.9rem;margin:2px 0 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 2px 12px rgba(30,40,90,.06);margin-bottom:16px}
button,input,select{font:inherit;color:inherit}
.icon-btn{background:var(--chip);border:0;border-radius:10px;padding:8px 12px;cursor:pointer}
.add{display:grid;grid-template-columns:1fr auto auto auto;gap:8px}
@media(max-width:560px){.add{grid-template-columns:1fr 1fr}.add input[type=text]{grid-column:1/-1}.add button{grid-column:1/-1}}
input[type=text],input[type=date],select{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--brand);outline-offset:1px}
.primary{background:var(--brand);color:#fff;border:0;border-radius:10px;padding:10px 18px;font-weight:600;cursor:pointer}
.primary:hover{background:var(--brand-d)}
.stats{display:flex;justify-content:space-between;font-size:.88rem;color:var(--muted);margin-bottom:8px}
.bar{height:8px;background:var(--chip);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--brand);transition:width .3s}
.tools{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;margin-bottom:12px}
.tabs{display:flex;gap:4px;background:var(--chip);padding:4px;border-radius:12px}
.tabs button{border:0;background:none;padding:6px 14px;border-radius:9px;cursor:pointer;color:var(--muted);font-weight:500}
.tabs button.on{background:var(--card);color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,.12)}
ul{list-style:none;margin:0;padding:0}
li.task{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line)}
li.task:last-child{border-bottom:0}
li.task input[type=checkbox]{width:20px;height:20px;accent-color:var(--brand);cursor:pointer;flex:none}
.body{flex:1;min-width:0}
.title{word-break:break-word}
.done .title{text-decoration:line-through;color:var(--muted)}
.meta{display:flex;gap:8px;align-items:center;font-size:.78rem;color:var(--muted);margin-top:2px}
.badge{padding:1px 9px;border-radius:99px;font-weight:600;color:#fff;font-size:.72rem}
.High{background:var(--hi)}.Medium{background:var(--med)}.Low{background:var(--lo)}
.overdue{color:var(--hi);font-weight:600}
.acts{display:flex;gap:4px}
.acts button{background:none;border:0;cursor:pointer;padding:6px 8px;border-radius:8px;color:var(--muted)}
.acts button:hover{background:var(--chip);color:var(--text)}
.edit{flex:1;display:flex;gap:6px;flex-wrap:wrap}
.edit input[type=text]{flex:1;min-width:140px}
.empty{text-align:center;color:var(--muted);padding:28px 8px}
.empty b{display:block;font-size:2rem}
.foot{display:flex;justify-content:space-between;align-items:center;font-size:.85rem;color:var(--muted);margin-top:10px}
.link{background:none;border:0;color:var(--brand);cursor:pointer;font-weight:600}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div><h1>Task<span>Flow</span></h1><p class="sub" id="today"></p></div>
    <button class="icon-btn" id="theme" aria-label="Toggle theme">🌓</button>
  </header>

  <div class="card">
    <div class="add">
      <input type="text" id="title" placeholder="What needs to be done?" maxlength="120" aria-label="Task title">
      <select id="prio" aria-label="Priority"><option>High</option><option selected>Medium</option><option>Low</option></select>
      <input type="date" id="due" aria-label="Due date">
      <button class="primary" id="addBtn">Add task</button>
    </div>
  </div>

  <div class="card">
    <div class="stats"><span id="count"></span><span id="pct"></span></div>
    <div class="bar"><i id="fill"></i></div>
  </div>

  <div class="card">
    <div class="tools">
      <div class="tabs" id="tabs">
        <button data-f="all" class="on">All</button><button data-f="active">Active</button><button data-f="done">Completed</button>
      </div>
      <select id="pf" aria-label="Filter by priority"><option value="all">All priorities</option><option>High</option><option>Medium</option><option>Low</option></select>
    </div>
    <input type="text" id="q" placeholder="Search tasks…" aria-label="Search" style="width:100%;margin-bottom:8px">
    <ul id="list"></ul>
    <div class="foot"><span>Tip: press Enter to add a task</span><button class="link" id="clear">Clear completed</button></div>
  </div>
</div>

<script>
var KEY="taskflow.tasks", tasks=[], filter="all", editing=null, order={High:0,Medium:1,Low:2};
try{var s=localStorage.getItem(KEY);if(s)tasks=JSON.parse(s)}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(tasks))}catch(e){}}
var $=function(i){return document.getElementById(i)};
$("today").textContent=new Date().toLocaleDateString(undefined,{weekday:"long",day:"numeric",month:"long"});

function add(){
  var t=$("title").value.trim();
  if(!t){$("title").focus();return}
  tasks.unshift({id:Date.now(),title:t,prio:$("prio").value,due:$("due").value,done:false});
  $("title").value="";$("due").value="";save();render();$("title").focus();
}
function esc(s){var d=document.createElement("div");d.textContent=s;return d.innerHTML}
function render(){
  var q=$("q").value.toLowerCase(),pf=$("pf").value;
  var list=tasks.filter(function(t){
    return (filter==="all"||(filter==="done")===t.done)&&(pf==="all"||t.prio===pf)&&t.title.toLowerCase().indexOf(q)>-1;
  }).sort(function(a,b){return a.done-b.done||order[a.prio]-order[b.prio]});
  var today=new Date().toISOString().slice(0,10);
  $("list").innerHTML=list.length?list.map(function(t){
    if(editing===t.id)return '<li class="task"><div class="edit"><input type="text" id="e-title" value="'+esc(t.title).replace(/"/g,"&quot;")+'" maxlength="120"><select id="e-prio">'+["High","Medium","Low"].map(function(p){return '<option'+(p===t.prio?" selected":"")+'>'+p+'</option>'}).join("")+'</select><button class="primary" data-a="save" data-id="'+t.id+'">Save</button><button class="icon-btn" data-a="cancel">Cancel</button></div></li>';
    var od=t.due&&!t.done&&t.due<today;
    return '<li class="task'+(t.done?" done":"")+'"><input type="checkbox" data-a="toggle" data-id="'+t.id+'"'+(t.done?" checked":"")+' aria-label="Mark complete"><div class="body"><div class="title">'+esc(t.title)+'</div><div class="meta"><span class="badge '+t.prio+'">'+t.prio+'</span>'+(t.due?'<span class="'+(od?"overdue":"")+'">'+(od?"Overdue · ":"Due ")+t.due+'</span>':"")+'</div></div><div class="acts"><button data-a="edit" data-id="'+t.id+'" aria-label="Edit">✏️</button><button data-a="del" data-id="'+t.id+'" aria-label="Delete">🗑️</button></div></li>';
  }).join(""):'<div class="empty"><b>✅</b>'+(tasks.length?"No tasks match your filters.":"No tasks yet. Add your first one above!")+'</div>';
  var d=tasks.filter(function(t){return t.done}).length,p=tasks.length?Math.round(d/tasks.length*100):0;
  $("count").textContent=d+" of "+tasks.length+" completed";$("pct").textContent=p+"%";$("fill").style.width=p+"%";
}
$("addBtn").onclick=add;
$("title").onkeydown=function(e){if(e.key==="Enter")add()};
$("q").oninput=render;$("pf").onchange=render;
$("tabs").onclick=function(e){var f=e.target.dataset.f;if(!f)return;filter=f;[].forEach.call($("tabs").children,function(b){b.classList.toggle("on",b===e.target)});render()};
$("list").onclick=function(e){
  var a=e.target.dataset.a,id=+e.target.dataset.id;if(!a)return;
  if(a==="toggle")tasks.forEach(function(t){if(t.id===id)t.done=!t.done});
  if(a==="del")tasks=tasks.filter(function(t){return t.id!==id});
  if(a==="edit")editing=id;
  if(a==="cancel")editing=null;
  if(a==="save"){var v=$("e-title").value.trim();if(v)tasks.forEach(function(t){if(t.id===id){t.title=v;t.prio=$("e-prio").value}});editing=null}
  save();render();
};
$("clear").onclick=function(){tasks=tasks.filter(function(t){return !t.done});save();render()};
$("theme").onclick=function(){
  var r=document.documentElement,dark=r.dataset.theme?r.dataset.theme==="dark":matchMedia("(prefers-color-scheme:dark)").matches;
  r.dataset.theme=dark?"light":"dark";
};
render();
</script>
</body>
</html>
